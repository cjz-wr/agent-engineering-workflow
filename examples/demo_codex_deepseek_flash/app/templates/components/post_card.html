<a
  href="/posts/{{ post.slug }}"
  class="group relative flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-1 hover:border-indigo-200 hover:shadow-lg hover:shadow-indigo-100">
  <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-indigo-500 to-violet-500 opacity-0 transition group-hover:opacity-100"></div>
  <h2 class="line-clamp-2 text-lg font-semibold leading-snug text-slate-900 group-hover:text-indigo-600">
    {{ post.title }}
  </h2>
  {% if post.content %}
    <p class="mt-2.5 line-clamp-3 text-sm leading-relaxed text-slate-500">{{ post.content | excerpt(110) }}</p>
  {% endif %}
  <div class="mt-auto flex items-center gap-2 pt-4 text-xs text-slate-400">
    <span class="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-100 text-[10px] font-bold text-indigo-600">
      {{ (post.author.display_name or post.author.username)[0] }}
    </span>
    <span class="truncate font-medium text-slate-500">{{ post.author.display_name or post.author.username }}</span>
    <span>·</span>
    <span class="shrink-0">{{ post.published_at | format_dt }}</span>
    <span>·</span>
    <span class="shrink-0">{{ post.content | reading_time }}</span>
  </div>
  <div class="mt-3 flex items-center gap-1 border-t border-slate-100 pt-3 text-sm font-medium text-indigo-600">
    阅读全文
    <i data-lucide="arrow-right" class="h-4 w-4 transition-transform group-hover:translate-x-0.5"></i>
  </div>
</a>
