<nav class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between gap-3 px-4">
    <a href="/" class="flex min-w-0 items-center gap-2.5">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-md shadow-indigo-200">
        <i data-lucide="newspaper" class="h-5 w-5"></i>
      </span>
      <span class="truncate text-lg font-bold tracking-tight text-slate-900">{{ app_name }}</span>
    </a>
    <div class="flex items-center gap-1.5 text-sm sm:gap-3">
      <a href="/" class="rounded-lg px-2.5 py-1.5 font-medium text-slate-600 hover:bg-slate-100 hover:text-indigo-600">首页</a>
      {% if current_user %}
        {% if current_user.is_admin %}
          <a href="/admin" class="hidden rounded-lg px-2.5 py-1.5 font-medium text-slate-600 hover:bg-slate-100 hover:text-indigo-600 md:inline-block">管理后台</a>
        {% endif %}
        <a href="/posts/new" class="inline-flex items-center gap-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3.5 py-2 font-medium text-white shadow-sm shadow-indigo-200 hover:from-indigo-700 hover:to-violet-700">
          <i data-lucide="square-pen" class="h-4 w-4"></i>
          <span class="hidden sm:inline">写文章</span>
        </a>
        <div class="hidden items-center gap-2 rounded-full bg-slate-100 py-1 pl-1 pr-3 sm:flex">
          <span class="flex h-7 w-7 items-center justify-center rounded-full bg-indigo-100 text-xs font-bold text-indigo-600">
            {{ (current_user.display_name or current_user.username)[0] }}
          </span>
          <span class="max-w-[8rem] truncate font-medium text-slate-700">{{ current_user.display_name or current_user.username }}</span>
        </div>
        <form method="post" action="/logout">
          <button class="inline-flex items-center gap-1 rounded-lg px-2.5 py-1.5 font-medium text-slate-500 hover:bg-rose-50 hover:text-rose-600" title="注销">
            <i data-lucide="log-out" class="h-4 w-4"></i>
            <span class="hidden sm:inline">注销</span>
          </button>
        </form>
      {% else %}
        <a href="/login" class="rounded-lg px-3 py-2 font-medium text-slate-600 hover:bg-slate-100 hover:text-indigo-600">登录</a>
        <a href="/register" class="rounded-lg border border-indigo-600 px-3.5 py-2 font-medium text-indigo-600 hover:bg-indigo-50">注册</a>
      {% endif %}
    </div>
  </div>
</nav>
