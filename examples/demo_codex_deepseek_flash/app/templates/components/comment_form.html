<form
  hx-post="/posts/{{ post.slug }}/comments"
  hx-target="#comments-list"
  hx-swap="beforeend"
  hx-on::after-request="if (event.detail.successful) this.reset();"
  class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <label class="mb-2 block text-sm font-medium text-slate-700">发表评论</label>
  <textarea name="content" rows="3" required maxlength="2000" placeholder="写下你的评论…"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
  <div class="mt-2 flex justify-end">
    <button class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
      <i data-lucide="send" class="h-4 w-4"></i>
      发表评论
    </button>
  </div>
</form>
