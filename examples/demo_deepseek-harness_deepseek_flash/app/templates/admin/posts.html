{% extends "base.html" %}
{% block title %}文章管理 · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold">文章管理</h1>
  <a href="/admin" class="text-sm text-gray-500 hover:text-indigo-600">← 返回后台</a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-left text-gray-500">
      <tr>
        <th class="px-4 py-3">文章</th>
        <th class="px-4 py-3">作者</th>
        <th class="px-4 py-3">状态</th>
        <th class="px-4 py-3">操作</th>
      </tr>
    </thead>
    <tbody>
      {% for post in posts %}
        {% include "components/admin_post_row.html" %}
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
