{% extends "base.html" %}
{% block title %}注册 · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <h1 class="text-xl font-bold mb-4">注册</h1>
    <form method="post" action="/register" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <input type="text" name="username" value="{{ username or '' }}" required autofocus
               class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">显示名（可选）</label>
        <input type="text" name="display_name" value="{{ display_name or '' }}"
               class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" name="password" required
               class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <button type="submit" class="w-full px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700">
        注册
      </button>
    </form>
    <p class="text-sm text-gray-500 mt-4">已有账号？<a href="/login" class="text-indigo-600 hover:underline">登录</a></p>
  </div>
</div>
{% endblock %}
